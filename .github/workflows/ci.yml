name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision-aid/backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Unit tests stub out ultralytics, so the heavy model stack is not needed in CI.
      - run: pip install fastapi==0.115.0 opencv-python-headless==4.10.0.84 numpy==1.26.4 -r requirements-dev.txt
      - run: pytest -q tests
